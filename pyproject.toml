[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pondolens"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1", "google-api-python-client>=2", "google-auth>=2", "databricks-sdk>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pondolens = "pondolens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
