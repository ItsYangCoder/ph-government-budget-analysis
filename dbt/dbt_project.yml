name: pondolens
version: 1.0.0
config-version: 2
profile: pondolens
model-paths:
- models
test-paths:
- tests
macro-paths:
- macros
clean-targets:
- target
- dbt_packages
vars:
  pondolens_catalog: pondolens
  bronze_schema: dev_bronze
  silver_schema: dev_silver
  gold_schema: dev_gold
models:
  pondolens:
    silver:
      +schema: dev_silver
      +tags:
      - silver
    gold:
      +schema: dev_gold
      +tags:
      - gold
flags:
  send_anonymous_usage_stats: false
