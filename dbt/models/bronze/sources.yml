  - name: regional_obligations
    description: Raw ingested source records. Keep source markers, missing values and lineage unchanged.
    columns:
    - name: source_name
      description: Source document or file name recorded by extraction. Use it with source_page to trace a value.
    - name: source_page
      description: Source page reference. Keep the original text in Bronze.
    - name: price_basis
      description: Source series label identifying the reported measure, such as actual obligations. Despite its name, do
        not assume this is an inflation-adjustment base year. Preserve the exact label.
    - name: year
      description: "Year the reported amount relates to. The profiling scope is 2021\u20132025. It is separate from the source\
        \ publication year."
    - name: category
      description: Source budget grouping, such as DEPARTMENTS, SPECIAL PURPOSE FUNDS, AUTOMATIC APPROPRIATIONS, or GRAND
        TOTAL. Categories may change across years.
    - name: particulars
      description: Source agency, fund, or aggregate label. The profiling SQL treats `All` as a category subtotal when the
        category is not GRAND TOTAL.
    - name: regions
      description: Source location label. Includes region labels, Nationwide, Central Office, and Total. This is not yet the
        canonical project region_code.
    - name: expenditure_amount
      description: Reported monetary amount as extracted. Keep numeric text, dash markers, and blanks unchanged in Bronze.
        Interpret it together with unit_amount.
    - name: unit_amount
      description: Source monetary unit. The supplied profiling SQL expects thousand pesos; confirm the observed labels when
        running it.
    - name: _rescued_data
      description: Ingestion rescue payload. Review nonblank values without changing raw records.
    - name: _drive_file_id
