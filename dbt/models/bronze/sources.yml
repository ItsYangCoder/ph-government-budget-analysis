version: 2
sources:
- name: bronze
  database: '{{ var(''pondolens_catalog'') }}'
  schema: '{{ var(''bronze_schema'') }}'
  tables:
  - name: agency_actuals
    description: Raw ingested source records. Keep source markers, missing values and lineage unchanged.
    columns:
    - name: fiscal_year
      description: "Fiscal year in the 2021\u20132023 layout."
    - name: statement_page
      description: Source statement page label from the earlier layout.
    - name: row_no
      description: Row reference in the earlier extracted layout; not an agency ID.
    - name: particulars
      description: "Agency, section, or sub-item label. Blank for the 2024\u20132025 Grand Total rows."
    - name: row_group
      description: Source hierarchy group in the earlier layout.
    - name: row_type
      description: Source row classification. Earlier values include Agency, Section total, Sub-item; later values include
        agency_total, category_total, line_item, sub_line_item.
    - name: column_group
      description: Budget stage or rate label in the earlier layout.
    - name: class
      description: 'Earlier expense class: PS, MOOE, FINEX, CO, Total, or N/A. CO means capital outlays here.'
    - name: value
      description: Earlier extracted measure. Interpret using unit and column_group.
    - name: value_as_shown
      description: Earlier source display text; keep it when interpreting zeros, dashes, and parentheses.
    - name: unit
      description: 'Earlier measure unit: percent or thousand pesos.'
    - name: footnote
      description: Earlier source footnote text.
    - name: source_sheet
      description: Earlier source sheet reference.
    - name: source_cell
      description: "Earlier source cell reference. Populated for 2021\u20132023; absent for 2024\u20132025."
    - name: source_name
      description: Later source workbook name.
    - name: source_page
      description: 'Later workbook page/sheet label: SUMMARY in 2024 and SUM in 2025.'
    - name: source_row
      description: Later source row reference; not a business identifier.
    - name: year
      description: "Fiscal year in the 2024\u20132025 layout."
    - name: category
      description: Later source hierarchy/category label, including Grand Total.
    - name: budget_stage
      description: Later budget stage such as Appropriations, Adjustments, Allotments, or Disbursements.
    - name: expense_class
      description: Later expense class. Blank is expected for measures reported without class breakdown.
    - name: unit_amount
      description: 'Later monetary unit: thousand pesos.'
    - name: amount
      description: Later monetary measure as extracted. Includes decimals, dash markers, and parenthesized negative amounts.
    - name: percent_type
      description: Later rate label identifying the numerator/denominator relationship.
    - name: percent_amount
      description: 'Later rate display text, such as 83.5% or #DIV/0!. This is separate from monetary amounts.'
    - name: _rescued_data
      description: Ingestion rescue payload. Review nonblank values without changing raw records.
    - name: _drive_file_id
      description: 'Ingestion lineage: drive file id.'
    - name: _source_file
      description: 'Ingestion lineage: source file.'
      data_tests:
      - not_null:
          config:
            enabled: '{{ var(''include_agency_actuals'', false) }}'
    - name: _landing_file
      description: 'Ingestion lineage: landing file.'
    - name: _source_modified_at
      description: Source file modification time; not the observation reference date.
    - name: _source_sheet
      description: Selected sheet when applicable; NULL is valid for non-spreadsheet sources.
    - name: _content_hash
      description: 'Ingestion lineage: content hash.'
    - name: _header_map
      description: 'Ingestion lineage: header map.'
    - name: _dataset_hash
      description: 'Ingestion lineage: dataset hash.'
    - name: _run_id
      description: 'Ingestion lineage: run id.'
      data_tests:
      - not_null:
          config:
            enabled: '{{ var(''include_agency_actuals'', false) }}'
    - name: _ingested_at
      description: Timestamp when ingestion recorded the row.
      data_tests:
      - not_null:
          config:
            enabled: '{{ var(''include_agency_actuals'', false) }}'
    data_tests:
    - nonempty:
        config:
          enabled: '{{ var(''include_agency_actuals'', false) }}'
    config:
      enabled: '{{ var(''include_agency_actuals'', false) }}'
  - name: completion_rate
    description: Raw ingested source records. Keep source markers, missing values and lineage unchanged.
    columns:
    - name: indicator
      description: Source indicator label including footnote reference. | 4.1.2 Completion rate 1/`; no null/blank values
        in profiled rows.
    - name: geolocation
      description: Source national or regional label. Hierarchy dots and footnote references are retained. | PHILIPPINES`,
        `..Region IV-A 2/`, `..Negros Island Region (NIR)`; 19 distinct labels.
    - name: level_of_education
      description: Education level for the reported completion percentage. | Elementary`, `Secondary (Junior High School)`,
        `Secondary (Senior High School)  4/`.
    - name: sex
      description: Source sex breakdown. Both Sexes is an aggregate category. | Both Sexes`, `Female`, `Male`.
    - name: _rescued_data
      description: Ingestion rescue payload. Review nonblank values without changing raw records.
    - name: _drive_file_id
      description: 'Ingestion lineage: drive file id.'
    - name: _source_file
      description: 'Ingestion lineage: source file.'
      data_tests:
      - not_null
    - name: _landing_file
      description: 'Ingestion lineage: landing file.'
