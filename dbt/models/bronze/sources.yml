      description: Source file modification time; not the observation reference date.
    - name: _source_sheet
      description: Selected sheet when applicable; NULL is valid for non-spreadsheet sources.
    - name: _content_hash
      description: 'Ingestion lineage: content hash.'
    - name: _header_map
      description: 'Ingestion lineage: header map.'
    - name: _dataset_hash
      description: 'Ingestion lineage: dataset hash.'
    - name: _run_id
      description: 'Ingestion lineage: run id.'
      data_tests:
      - not_null
    - name: _ingested_at
      description: Timestamp when ingestion recorded the row.
      data_tests:
      - not_null
    - name: c_2021
      description: Completion percentage for source year label 2021.
    - name: c_2022
      description: Completion percentage for source year label 2022.
    - name: c_2023
      description: Completion percentage for source year label 2023.
    - name: c_2024
      description: Completion percentage for source year label 2024.
    - name: c_2025
      description: 'Source year label 2025. All 171 observations contain the source marker ''...'' in the profiled snapshot.

        '
    data_tests:
    - nonempty
  - name: grdp_per_capita
    description: Raw ingested source records. Keep source markers, missing values and lineage unchanged.
    columns:
    - name: source_name
      description: 'Source workbook/report label. Observed: `2018-2025 GRDP_Reg_(with NIR as of April 2026)`.'
    - name: source_page
      description: Extracted worksheet label; observed `Capita`.
    - name: region_id
      description: Source geographic code, such as NCR, IV-A, or NIR. Blank for Philippines and MIMAROPA; resolve using the
        accompanying name.
    - name: region
      description: Source geography name; includes Philippines and regional names.
    - name: year
      description: "Source year label. Parse and validate before applying the 2021\u20132025 project filter."
    - name: grdp_per_capita_amount
      description: Decimal measure text in Philippine pesos per person. Preserve original text in Bronze.
    - name: price_basis
      description: At Current Prices` or `At Constant 2018 Prices`. These are separate observations.
    - name: unit
      description: Observed `Philippine pesos per person`. No thousand-peso scaling applies.
    - name: geographic_level
      description: 'region` or `country`. Proposed Silver naming: `region` or `national`.'
    - name: source_table
      description: 'Source table reference: Table 2.1 for current prices; Table 2.2 for constant prices.'
    - name: source_file
      description: Source-supplied file/report identifier. Distinct from pipeline `_source_file`.
    - name: _rescued_data
      description: Ingestion rescue payload. Review nonblank values without changing raw records.
    - name: _drive_file_id
      description: 'Ingestion lineage: drive file id.'
    - name: _source_file
      description: 'Ingestion lineage: source file.'
      data_tests:
      - not_null
    - name: _landing_file
      description: 'Ingestion lineage: landing file.'
    - name: _source_modified_at
      description: Source file modification time; not the observation reference date.
    - name: _source_sheet
      description: Selected sheet when applicable; NULL is valid for non-spreadsheet sources.
    - name: _content_hash
      description: 'Ingestion lineage: content hash.'
    - name: _header_map
      description: 'Ingestion lineage: header map.'
    - name: _dataset_hash
      description: 'Ingestion lineage: dataset hash.'
    - name: _run_id
      description: 'Ingestion lineage: run id.'
      data_tests:
      - not_null
    - name: _ingested_at
      description: Timestamp when ingestion recorded the row.
      data_tests:
      - not_null
    data_tests:
    - nonempty
  - name: hospital
    description: Raw ingested source records. Keep source markers, missing values and lineage unchanged.
    columns:
    - name: year
      description: "Year of the hospital count | 2021\u20132024 in the current dataset | No nulls observed | Cast to INT;\
        \ validate allowed years"
    - name: region_name
      description: Historical source region name | One of the 17 source regions | No nulls observed | Trim and map through
        the shared region crosswalk
    - name: hospital_type
      description: Ownership/category of regulated hospitals | Government in this Bronze table | Government in all 68 rows;
        no nulls observed | Trim and standardize to Government
    - name: regulated_hospital_count
      description: Number of regulated hospitals for the region and year | Whole number greater than or equal to zero | No
        nulls, nonnumeric values, or negative values observed | Cast to INT; reject invalid values
    - name: unit
      description: Unit for the count | hospitals | hospitals in all 68 rows; no nulls observed | Trim and standardize to
        hospitals
    - name: source_agency
      description: Agency responsible for the source data | DOH Health Facilities and Services Regulatory Bureau | Source
        lineage field | Preserve
    - name: source_publication
      description: Publication containing the source table | 2025 Philippine Statistical Yearbook | Source lineage field |
        Preserve
    - name: source_table
      description: Table identifier in the publication | 9.18 | Source lineage field | Preserve
    - name: source_page
      description: Page locator in the publication | 9-28 | Source lineage field | Preserve
    - name: source_url
      description: Link to the source publication | Valid source URL | Source lineage field | Preserve
    - name: coverage_note
      description: Note about source coverage or extraction | Retain the source note as recorded | Source lineage field |
        Preserve
    - name: _rescued_data
      description: 'Rescue payload for parsing exceptions. No rescued records were observed.

        '
    - name: _drive_file_id
      description: Google Drive source file identifier.
    - name: _source_file
      description: Source path relative to the configured Drive folder.
    - name: _landing_file
      description: Saved source-file path in the landing volume.
    - name: _source_modified_at
      description: Source modification timestamp stored as text.
    - name: _source_sheet
      description: Source sheet name; null is expected for CSV input.
    - name: _content_hash
      description: Source-file content hash recorded by ingestion.
    - name: _header_map
      description: JSON mapping of normalized to original column names.
    - name: _dataset_hash
      description: Dataset fingerprint used to detect unchanged input.
    - name: _run_id
      description: Ingestion execution identifier.
    - name: _ingested_at
      description: Ingestion timestamp.
    data_tests:
    - nonempty
