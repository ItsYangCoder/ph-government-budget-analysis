version: 2
models:
- name: completion_rate
  description: "Existing silver table. Grain: year \xD7 region_code \xD7 indicator \xD7 level_of_education \xD7 sex."
  columns:
  - name: completion_rate_id
    description: Completion rate id.
    data_tests:
    - not_null
    - unique
  - name: year
    description: Reference year of the observation.
    data_tests:
    - not_null
  - name: region_code
    description: Canonical project location code from the shared crosswalk; this is not a PSGC code.
    data_tests:
    - not_null
  - name: region_name
    description: Canonical location name.
    data_tests:
    - not_null
  - name: geographic_level
    description: Geographic level.
    data_tests:
    - not_null
  - name: indicator
    description: Indicator.
    data_tests:
    - not_null
  - name: level_of_education
    description: Level of education.
    data_tests:
    - not_null
  - name: sex
    description: Sex.
    data_tests:
    - not_null
  - name: completion_rate
    description: Completion rate.
  - name: unit
    description: Unit.
    data_tests:
    - not_null
  - name: raw_value
    description: Original source value or marker retained for traceability.
  - name: value_status
    description: Status recorded by the transformation; check it before using the numeric value.
    data_tests:
    - not_null
  - name: processed_at
    description: Timestamp recorded by the Silver or Gold transformation.
    data_tests:
    - not_null
  data_tests:
  - nonempty
  - unique_grain:
      arguments:
        columns:
        - year
        - region_code
        - indicator
        - level_of_education
        - sex
