name: Code checks

on:
  push:
    branches:
      - dev
      - main
      - "feat/**"
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install notebook validator
        run: python -m pip install "nbformat>=5.10,<6"

      - name: Check Python files and notebooks
        run: python scripts/check_code.py